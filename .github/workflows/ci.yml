# Wesal platform CI (backend + frontend). Build and tests gate; lint reports
# without failing because pre-existing warnings/errors are tracked separately.
# No secrets are used here and nothing is deployed from this workflow.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths:
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    name: Backend restore, build, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Wesal.slnx

      - name: Build (Release)
        run: dotnet build Wesal.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Wesal.slnx -c Release --no-build

      # Guards the historical production failure: Backend/.dockerignore excluded
      # documentation/, so the Docker image shipped with ZERO embedded AI knowledge
      # articles. Build the REAL production image and inspect the published assembly.
      - name: Production image ships the AI knowledge base
        working-directory: .
        run: |
          docker build -t wesal-api-ci Backend
          cid=$(docker create wesal-api-ci)
          docker cp "$cid:/app/Wesal.Infrastructure.dll" /tmp/Wesal.Infrastructure.dll
          docker rm "$cid"
          count=$(grep -a -o 'WesalKnowledge\.[A-Za-z0-9_.-]*\.md' /tmp/Wesal.Infrastructure.dll | sort -u | wc -l)
          expected=$(find Backend/documentation/ai-knowledge -name '*.md' | wc -l)
          echo "Embedded knowledge articles in the production image: $count (source files: $expected)"
          if [ "$count" -lt 1 ] || [ "$count" -ne "$expected" ]; then
            echo "::error::The production Docker image does not contain the full AI knowledge base ($count of $expected)."
            exit 1
          fi

  frontend:
    name: Frontend install, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5298/api/v1
      CI: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (advisory until pre-existing findings are cleared)
        continue-on-error: true
        run: npm run lint

      - name: API base URL resolution and production env gate tests
        run: npm run verify:api-base-url

      - name: Mabrouk assistant contract (routes, navigation safety, context, recovery)
        run: npm run verify:assistant

      - name: Production env gate
        run: node scripts/verify-production-env.mjs

      - name: Build
        run: npm run build
