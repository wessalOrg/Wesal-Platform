<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c17b7f" />
    <title>وصال — لا يوجد اتصال</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #3d342e;
        background: linear-gradient(180deg, #ffffff 0%, #fcfbf9 55%, #f8f3ee 100%);
      }
      .card {
        max-width: 26rem;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #eee6de;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 18px 40px rgba(90, 55, 45, 0.12);
      }
      .hero {
        display: block;
        width: 11.5rem;
        height: 11.5rem;
        margin: 0 auto 1rem;
        object-fit: cover;
        border-radius: 50%;
        background: #f4e4e2;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1.25rem; color: #8a7a70; font-size: 0.9rem; line-height: 1.8; }
      button {
        min-height: 2.75rem;
        padding-inline: 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #c17b7f;
        color: #fff;
        font-size: 0.9rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="hero"
        src="/assistant/mabrouk-offline-wifi.jpg"
        width="368"
        height="368"
        alt="مبروك يشير إلى أن شبكة الواي فاي مقطوعة"
      />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذر تحميل صفحة وصال حالياً. تحقق من الاتصال ثم أعد المحاولة.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
